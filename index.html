<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Contábil Ótica &amp; RF</title>
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --sunk:#E9EDEF; --line:#D5DCE0; --line2:#E4E9EC;
  --ink:#15202A; --ink2:#4A5864; --ink3:#7A8893;
  --pos:#1D7A4C; --neg:#B3261E; --warn:#A8660B; --warnbg:#FBF1DE; --negbg:#FBE9E7; --posbg:#E4F3EA;
  --acc:#0F6E86; --accbg:#E1F0F4; --acc2:#0A5569;
  --serif:"IBM Plex Serif",Georgia,serif; --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
[data-emp="rf"]{ --acc:#8A5410; --accbg:#F6ECDD; --acc2:#6B400A; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10161B; --surface:#172027; --sunk:#1D2830; --line:#2C3A44; --line2:#23303A;
    --ink:#E6ECEF; --ink2:#A7B4BD; --ink3:#77858F;
    --pos:#5CC48F; --neg:#F07B72; --warn:#E3A74A; --warnbg:#33281A; --negbg:#3A2020; --posbg:#17332A;
    --acc:#56B8D0; --accbg:#16323B; --acc2:#8ED3E4;
  }
  :root:not([data-theme="light"]) [data-emp="rf"]{ --acc:#E0A659; --accbg:#3A2B17; --acc2:#F0C68C; }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10161B; --surface:#172027; --sunk:#1D2830; --line:#2C3A44; --line2:#23303A;
  --ink:#E6ECEF; --ink2:#A7B4BD; --ink3:#77858F;
  --pos:#5CC48F; --neg:#F07B72; --warn:#E3A74A; --warnbg:#33281A; --negbg:#3A2020; --posbg:#17332A;
  --acc:#56B8D0; --accbg:#16323B; --acc2:#8ED3E4;
}
:root[data-theme="dark"] [data-emp="rf"]{ --acc:#E0A659; --accbg:#3A2B17; --acc2:#F0C68C; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:18px 48px}
@media (max-width:520px){.wrap{padding-inline:16px}}
h1,h2,h3{text-wrap:balance;margin:0}
.num,td.v,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* cabeçalho */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.brand h1{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.01em;margin-top:2px}
.brand .sub{color:var(--ink2);font-size:13px;margin-top:2px}
.emp-switch{display:flex;gap:6px;flex-wrap:wrap}
.emp-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;text-align:left;min-width:180px}
.emp-btn small{display:block;color:var(--ink3);font-size:11px}
.emp-btn[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:var(--accbg)}
.emp-btn[data-e="otica"] b{color:#0F6E86}.emp-btn[data-e="rf"] b{color:#8A5410}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .emp-btn[data-e="otica"] b{color:#56B8D0}:root:not([data-theme="light"]) .emp-btn[data-e="rf"] b{color:#E0A659}}
:root[data-theme="dark"] .emp-btn[data-e="otica"] b{color:#56B8D0}:root[data-theme="dark"] .emp-btn[data-e="rf"] b{color:#E0A659}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 18px}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:9px;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--ink2);font:inherit;font-weight:500;padding:7px 14px;border-radius:7px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.months{display:flex;gap:4px;flex-wrap:wrap}
.mbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink2);font:inherit;font-family:var(--mono);font-size:12.5px;padding:6px 10px;border-radius:6px;cursor:pointer}
.mbtn[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .mbtn[aria-pressed="true"]{color:#10161B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mbtn[aria-pressed="true"]{color:#10161B}}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ficha da empresa */
.ficha{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink2);margin-bottom:16px}
.ficha b{color:var(--ink);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--sunk);color:var(--ink2)}
.chip.acc{background:var(--accbg);color:var(--acc2)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.neg{background:var(--negbg);color:var(--neg)}
.chip.pos{background:var(--posbg);color:var(--pos)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.kpi .n{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .d{font-size:12px;color:var(--ink2);margin-top:2px}
.neg-t{color:var(--neg)}.pos-t{color:var(--pos)}

.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.panel h2{font-size:15px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.panel h2 small{font-weight:400;color:var(--ink3);font-size:12px}
.panel + .panel{margin-top:18px}
.muted{color:var(--ink3)}
.note{font-size:12.5px;color:var(--ink2);margin:8px 0 0}

/* gráfico */
.chart{width:100%;height:auto;display:block;margin-top:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* barras de categorias */
.hb{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:6px 10px;align-items:center;margin-top:12px;font-size:12.5px}
.hb .t{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.hb .t span{display:block;height:100%;background:var(--acc);border-radius:4px}
.hb .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}

/* alertas */
.alerts{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.alerts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13px;padding:9px 11px;border-radius:8px;background:var(--sunk)}
.alerts li .chip{margin-top:1px}

/* DAS */
.das-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.das-grid div{border-top:2px solid var(--line2);padding-top:6px}
.das-grid .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.das-grid .n{font-family:var(--mono);font-size:15px;font-weight:600}
.inline-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:12.5px}

/* tabelas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;background:var(--sunk);position:sticky;top:0;white-space:nowrap}
td.v,th.v{text-align:right;white-space:nowrap}
tr.g td{background:var(--sunk);font-weight:600}
tr.t td{font-weight:700;border-top:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3)}
tr.t.final td{background:var(--accbg);color:var(--acc2)}
tr.s td:first-child{padding-left:26px;color:var(--ink2)}
tr.memo td{color:var(--ink3);font-style:italic}
td.code{font-family:var(--mono);font-size:12px;color:var(--ink3);white-space:nowrap}
.dc{font-size:10.5px;color:var(--ink3);margin-left:3px}

/* lançamentos */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
select,input[type=text],input[type=date],input[type=number]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
td select{font-size:12.5px;padding:4px 6px;width:100%;min-width:190px}
td select.pend{border-color:var(--warn);background:var(--warnbg)}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--acc);background:var(--acc);color:#fff;padding:7px 14px;border-radius:7px;cursor:pointer}
:root[data-theme="dark"] .btn{color:#10161B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#10161B}}
.btn.ghost{background:transparent;color:var(--acc2)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{border-color:var(--neg);background:transparent;color:var(--neg)}
.linkbtn{border:0;background:none;color:var(--ink3);font:inherit;font-size:12px;cursor:pointer;padding:2px 4px}
.linkbtn:hover{color:var(--neg)}
/* relatório para PDF */
.rel .bar,.rel .emp-switch,.rel #xlsBtn{display:none}
.rel-sec{margin-top:22px}
.rel-sec > h2.rel-t{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rel-quebra{break-before:page}
.rel .tbl-wrap{overflow:visible}
.rel table{font-size:11.5px}
.rel th{position:static}
.rel .panel,.rel tr,.rel .kpis,.rel .alerts li{break-inside:avoid}
.rel-rodape{margin-top:24px;font-size:11px;color:var(--ink3);border-top:1px solid var(--line);padding-top:8px}
@page{size:A4;margin:11mm}
.rel .kpis{grid-template-columns:repeat(3,1fr)}
@media print{html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{max-width:none;padding-inline:0}.grid2{grid-template-columns:1fr 1fr}}
details.add{margin-bottom:14px}
details.add summary{cursor:pointer;font-weight:600;color:var(--acc2);padding:4px 0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px;align-items:end}
.form label{display:grid;gap:3px;font-size:11.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.form label input,.form label select{text-transform:none;letter-spacing:0;font-weight:400}
.form .wide{grid-column:span 2}
@media (max-width:520px){.form .wide{grid-column:auto}}
.sumline{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--ink2);margin:10px 2px 0}
.sumline b{font-family:var(--mono)}
.obs{display:block;font-size:11.5px;color:var(--warn)}
.status{min-height:18px;font-size:12.5px;color:var(--ink2);margin-top:6px}
.center{padding:60px 0;text-align:center;color:var(--ink2)}
.ok-badge{display:inline-flex;gap:6px;align-items:center}
</style>

<div class="wrap" id="app" data-emp="rf">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Controle contábil · Simples Nacional · 2026</div>
      <h1>Livro Contábil</h1>
      <div class="sub">DRE, balancete e movimento mensal a partir dos extratos bancários</div>
    </div>
    <div class="emp-switch" role="group" aria-label="Empresa">
      <button class="emp-btn" data-e="otica" aria-pressed="false"><b>Ótica Vem Pra Cá</b><small>18.295.192/0001-76 · Anexo I</small></button>
      <button class="emp-btn" data-e="rf" aria-pressed="true"><b>RF Consultoria</b><small>67.879.404/0001-78 · Anexo III/V</small></button>
    </div>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="geral" aria-selected="true">Visão geral</button>
      <button class="tab" role="tab" data-t="dre" aria-selected="false">DRE</button>
      <button class="tab" role="tab" data-t="bal" aria-selected="false">Balancete</button>
      <button class="tab" role="tab" data-t="lanc" aria-selected="false">Entradas e saídas</button>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div class="months" id="months" role="group" aria-label="Competência"></div><button class="btn" id="xlsBtn" hidden>Baixar planilha do mês</button></div>
  </div>

  <div class="ficha" id="ficha"></div>
  <main id="view"><div class="center">Carregando os lançamentos…</div></main>
</div>

/* ---------- Simples Nacional: anexos ---------- */
const ANEXOS = {
  I:  [[180e3,.04,0],[360e3,.073,5940],[720e3,.095,13860],[1.8e6,.107,22500],[3.6e6,.143,87300],[4.8e6,.19,378000]],
  III:[[180e3,.06,0],[360e3,.112,9360],[720e3,.135,17640],[1.8e6,.16,35640],[3.6e6,.21,125640],[4.8e6,.33,648000]],
  V:  [[180e3,.155,0],[360e3,.18,4500],[720e3,.195,9900],[1.8e6,.205,17100],[3.6e6,.23,62100],[4.8e6,.305,540000]],
};
function aliquota(anexo, rbt){
  const t = ANEXOS[anexo]; let i = t.findIndex(f => rbt <= f[0]); if (i < 0) i = 5;
  const [,nom,pd] = t[i];
  const ef = rbt > 0 ? Math.max((rbt*nom - pd)/rbt, 0) : nom;
  return {faixa:i+1, nom, pd, ef};
}

const inMes = (l,m) => l.data.slice(0,7) === m;
const sumCat = (ls, pred) => r2(ls.reduce((a,l) => a + (pred(l.cat) ? l.valor : 0), 0));
const contaNome = id => (E().contas.find(c => c.id === id) || {nome:id}).nome;

/* ---------- apuração ---------- */
const baseMes = m => { const ls = L().filter(l => inMes(l,m)); return r2(sumCat(ls, c => c.startsWith('3.1')) + sumCat(ls, c => c==='3.2.02')); };
const folhaMes = m => -sumCat(L().filter(l => inMes(l,m)), c => c.startsWith('4.2'));
function apuracao(m){
  const e = E(), meses = monthsOf();
  const base = baseMes(m), folha = folhaMes(m);
  let rbt, folha12, fonte;
  const ini = e.inicio ? e.inicio.slice(0,7) : null;
  const antes = meses.filter(x => x < m && (!ini || x >= ini));
  const manual = e.rbt12 && e.rbt12[m];
  if (manual) { rbt = manual; fonte = 'informado'; folha12 = antes.length ? antes.reduce((a,x)=>a+folhaMes(x),0)/antes.length*12 : folha*12; }
  else if (ini && antes.length < 12) {
    if (!antes.length) { rbt = base*12; folha12 = folha*12; fonte = '1º mês de atividade: receita do mês × 12'; }
    else { rbt = antes.reduce((a,x)=>a+baseMes(x),0)/antes.length*12; folha12 = antes.reduce((a,x)=>a+folhaMes(x),0)/antes.length*12; fonte = 'início de atividade: média de ' + antes.length + ' mês(es) × 12'; }
  } else {
    const pool = meses.filter(x => x <= m);
    rbt = pool.reduce((a,x)=>a+baseMes(x),0)/Math.max(pool.length,1)*12; folha12 = 0; fonte = 'ESTIMADO pela média dos meses do painel – informe o RBT12 real';
  }
  let anexo = e.anexo, fr = null;
  if (e.anexo === 'III/V') { fr = rbt > 0 ? folha12/rbt : 0; anexo = fr >= .28 ? 'III' : 'V'; }
  const a = aliquota(anexo, rbt);
  const das = r2(Math.max(base,0) * a.ef);
  let alt = null;
  if (e.anexo === 'III/V' && anexo === 'V') {
    const a3 = aliquota('III', rbt);
    const prolabore = Math.max(.28*rbt/12 - folha12/12, 0);
    alt = {das3: r2(Math.max(base,0)*a3.ef), ef3:a3.ef, prolabore: r2(prolabore), inss: r2(prolabore*.11)};
  }
  return {m, base, rbt:r2(rbt), fonte, anexo, fr, ...a, das, alt, manual:!!manual};
}

/* ---------- partidas dobradas ---------- */
function bancoCod(i){ return '1.1.02.' + String(i+1).padStart(2,'0'); }
function partidas(){
  const e = E(), out = [];
  e.contas.forEach((c,i) => { if (c.saldoInicial) out.push({m:'0000', deb:bancoCod(i), cred:'2.3.09', v:c.saldoInicial}); });
  const idx = Object.fromEntries(e.contas.map((c,i)=>[c.id,i]));
  for (const l of L()) {
    const b = bancoCod(idx[l.conta] ?? 0), m = l.data.slice(0,7), v = Math.abs(l.valor);
    if (l.valor >= 0) out.push({m, deb:b, cred:l.cat, v}); else out.push({m, deb:l.cat, cred:b, v});
  }
  for (const m of monthsOf()) { const a = apuracao(m); if (a.das > 0) out.push({m, deb:'3.2.01', cred:'2.1.01', v:a.das}); }
  return out;
}
function nomeConta(cod){
  if (cod.startsWith('1.1.02.')) { const c = E().contas[+cod.slice(7)-1]; return c ? c.nome : 'Banco'; }
  return NOME[cod] || cod;
}

  const arr = Object.entries(saidas).sort((x,y)=>y[1]-x[1]); const mx = Math.max(...arr.map(x=>x[1]),1);
  const totS = arr.reduce((x,y)=>x+y[1],0);
  h += `<section class="panel"><h2>Para onde foi o dinheiro <small>${mLabel(m)} · ${money(totS)} em saídas</small></h2>
     <div class="hb">${arr.map(([g,v]) => `<span>${esc(g)}</span><div class="t"><span style="width:${(v/mx*100).toFixed(1)}%"></span></div><span class="v">${money(v)}</span>`).join('') || '<span class="muted">Sem saídas no mês.</span>'}</div></section></div>`;

  return h;
}
function grupoSaida(c){
  if (c==='2.3.03') return 'Retiradas do sócio';
  if (c.startsWith('4.1')) return 'Custos (mercadorias e terceiros)';
  if (c.startsWith('4.2')) return 'Pessoal e autônomos';
  if (c.startsWith('4.3')) return 'Despesas administrativas';
  if (c.startsWith('4.4')) return 'Tarifas e juros';
  if (c.startsWith('4.5') || c==='2.1.01') return 'Tributos';
  if (c==='1.1.99') return 'A classificar';
  if (c==='1.1.09') return 'Transferências entre contas';
  if (c==='1.1.08') return 'Estornos de PIX';
  if (c==='1.1.03') return 'Aplicações financeiras';
  return NOME[c] || c;
}
function resultadoMes(m){ const lm = L().filter(l=>inMes(l,m)); return r2(sumCat(lm,c=>c.startsWith('3.1')||c==='3.2.02'||c[0]==='4'||c[0]==='5') - apuracao(m).das); }
function saldosBancos(m){
  const e = E(), per = e.contas.map(c => ({...c, s: c.saldoInicial||0}));
  for (const l of L()) if (l.data.slice(0,7) <= m) { const c = per.find(x=>x.id===l.conta); if (c) c.s += l.valor; }
  return {per, total: r2(per.reduce((a,c)=>a+c.s,0))};
}
function chartSVG(serie){
  if (!serie.length) return '';
  const W = 560, H = 230, pl = 64, pr = 12, pt = 16, pb = 30;
  const max = Math.max(...serie.map(s=>Math.max(s.r,s.d)), 1), min = Math.min(0, ...serie.map(s=>s.res));
  const niceStep = (() => { const raw = (max-min)/4, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1,2,2.5,5,10].map(k=>k*p).find(s=>s>=raw); })();
  const top = Math.ceil(max/niceStep)*niceStep, bot = Math.floor(min/niceStep)*niceStep;
  const y = v => pt + (top - v)/(top-bot)*(H-pt-pb);
  const gw = (W-pl-pr)/serie.length, bw = Math.min(26, gw/3.2);
  let g = '';
  for (let v = bot; v <= top + 1e-6; v += niceStep) g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--ink3)" font-family="IBM Plex Mono,monospace">${(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})} mil</text>`;
  g += `<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink3)" stroke-width="1"/>`;
  const pts = [];
  serie.forEach((s,i) => {
    const cx = pl + gw*i + gw/2;
    g += `<rect x="${cx-bw-2}" y="${y(s.r)}" width="${bw}" height="${Math.max(y(0)-y(s.r),0)}" fill="var(--acc)" rx="2"><title>Receita ${money(s.r)}</title></rect>`;
    g += `<rect x="${cx+2}" y="${y(s.d)}" width="${bw}" height="${Math.max(y(0)-y(s.d),0)}" fill="var(--ink3)" opacity=".75" rx="2"><title>Custos+despesas+DAS ${money(s.d)}</title></rect>`;
    g += `<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11.5" fill="var(--ink2)" font-family="IBM Plex Mono,monospace"${s.m===S.mes?' font-weight="700"':''}>${mLabel(s.m)}</text>`;
    pts.push([cx, y(s.res), s.res]);
  });
  if (pts.length > 1) g += `<polyline points="${pts.map(p=>p.slice(0,2).join(',')).join(' ')}" fill="none" stroke="var(--pos)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  pts.forEach(([x,yy,v]) => { g += `<circle cx="${x}" cy="${yy}" r="4" fill="${v<0?'var(--neg)':'var(--pos)'}" stroke="var(--surface)" stroke-width="1.5"><title>Resultado ${money(v)}</title></circle>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receita e despesas por mês">${g}</svg>`;
}

/* ---------- DRE ---------- */
function dreModel(upTo){
  const ms = monthsOf().filter(x => !upTo || x <= upTo), ls = L();
  const cols = [...ms, 'acum'];
  const val = (m, pred) => m==='acum' ? r2(ms.reduce((a,x)=>a+val(x,pred),0)) : sumCat(ls.filter(l=>inMes(l,m)), pred);
  const das = m => m==='acum' ? r2(ms.reduce((a,x)=>a+apuracao(x).das,0)) : apuracao(m).das;
  const recB = m => val(m, c=>c.startsWith('3.1'));
  const ded = m => r2(val(m, c=>c==='3.2.02') - das(m));
  const recL = m => r2(recB(m) + ded(m));
  const cus = m => val(m, c=>c.startsWith('4.1'));
  const lb = m => r2(recL(m) + cus(m));
  const op = m => val(m, c=>c.startsWith('4.2')||c.startsWith('4.3')||c.startsWith('4.5'));
  const ro = m => r2(lb(m) + op(m));
  const fin = m => r2(val(m, c=>c[0]==='5') + val(m, c=>c.startsWith('4.4')));
  const rl = m => r2(ro(m) + fin(m));
  const used = new Set(ls.map(l=>l.cat));
  const sub = pre => PLANO.filter(([c]) => c.startsWith(pre) && used.has(c)).map(([c,n]) => ({lbl:n, cls:'s', f:m=>val(m,x=>x===c)}));
  const rows = [
    {lbl:'RECEITA BRUTA', cls:'g', f:recB}, ...sub('3.1'),
    {lbl:'(−) DEDUÇÕES DA RECEITA', cls:'g', f:ded},
    {lbl:'Simples Nacional – DAS (estimado)', cls:'s', f:m=>-das(m)}, ...sub('3.2.02'),
    {lbl:'= RECEITA LÍQUIDA', cls:'t', f:recL},
    {lbl:'(−) CUSTO DAS MERCADORIAS E SERVIÇOS', cls:'g', f:cus}, ...sub('4.1'),
    {lbl:'= LUCRO BRUTO', cls:'t', f:lb},
    {lbl:'(−) DESPESAS OPERACIONAIS', cls:'g', f:op},

/* ---------- balancete ---------- */
function balancete(m){
  const ps = partidas(), acc = {};
  const get = c => acc[c] || (acc[c] = {cod:c, ant:0, deb:0, cred:0});
  for (const p of ps) {
    if (p.m < m) { get(p.deb).ant += p.v; get(p.cred).ant -= p.v; }
    else if (p.m === m) { get(p.deb).deb += p.v; get(p.cred).cred += p.v; }
  }
  return Object.values(acc).map(a => ({...a, ant:r2(a.ant), deb:r2(a.deb), cred:r2(a.cred), saldo:r2(a.ant + a.deb - a.cred)}))
    .filter(a => Math.abs(a.ant)>.004 || a.deb || a.cred)
    .sort((x,y) => x.cod.localeCompare(y.cod, 'en', {numeric:true}));
}

/* ---------- importação InfinitePay ---------- */
function parseCSV(txt){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++) { const ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch; }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const parseValor = s => { const neg = /-/.test(s); const n = parseFloat(String(s).replace(/[^\d,.]/g,'').replace(/\./g,'').replace(',','.')); return (neg?-1:1) * (isNaN(n)?0:n); };
const normal = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^pix (enviado para |recebido de )?/,'').replace(/[^a-z0-9]+/g,' ').trim();
function sugerir(nome, det, v){
  const n = normal(nome);
  if (/robson ferreira/.test(n)) return v < 0 ? '2.3.03' : '2.3.04';
  if (/devolvido|estorno/i.test(det)) return '1.1.08';
  if (/rf consultoria|otica vem/.test(n)) return '1.1.09';
  if (/deposito de vendas|^vendas/.test(n) || /Depósito/i.test(det)) return S.emp==='otica' ? '3.1.01' : '3.1.02';
  const hist = L().filter(l => l.cat !== '1.1.99' && normal(l.descricao).includes(n.slice(0,18)) && Math.sign(l.valor) === Math.sign(v));
  if (n.length > 5 && hist.length) return hist[hist.length-1].cat;
  if (/light|enel/.test(n)) return '4.3.02';
  if (/claro|tim s a|telefonica|vivo|wireless/.test(n)) return '4.3.03';
  if (/client co/.test(n)) return '4.3.05';
  if (v > 0) return S.emp==='otica' ? '3.1.01' : '3.1.02';
  return '1.1.99';
}
function prepararImport(txt, conta){
  const rows = parseCSV(txt.replace(/^﻿/,''));
  const hd = rows.shift().map(x => normal(x));
  const ix = k => hd.findIndex(h => h.includes(k));
  const iD = ix('data'), iN = ix('nome'), iT = ix('detalhe'), iV = ix('valor');
  if (iD < 0 || iV < 0) throw new Error('Não achei as colunas Data e Valor. Use o CSV exportado do extrato da InfinitePay.');
  const chave = l => l.conta + '|' + l.data + '|' + l.valor.toFixed(2) + '|' + normal(l.descricao).slice(0,24);
  const existentes = new Set(L().map(chave));
  const novos = []; let dup = 0;
  for (const r of rows) {
    let d = r[iD].trim(); if (/^\d{2}\/\d{2}\/\d{4}$/.test(d)) d = d.slice(6)+'-'+d.slice(3,5)+'-'+d.slice(0,2);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
    const nome = (r[iN]||'').trim(), det = (r[iT]||'').trim(), v = r2(parseValor(r[iV]));
    const l = {empresa:S.emp, data:d, conta, descricao: nome + (det ? ' — ' + det : ''), valor:v, cat:sugerir(nome, det, v), obs:'', origem:'csv-infinitepay'};
    const k = chave(l); if (existentes.has(k)) { dup++; continue; } existentes.add(k); novos.push(l);
  }
  return {novos, dup};
}

  if (!S.mes) { v.innerHTML = '<div class="center">Nenhum lançamento para esta empresa ainda. Use a aba Entradas e saídas para lançar ou importar.</div>'; if (S.tab==='lanc') v.innerHTML = viewLanc(); return; }
  const openAdd = document.getElementById('addBox')?.open;
  v.innerHTML = S.tab==='dre' ? viewDRE() : S.tab==='bal' ? viewBal() : S.tab==='lanc' ? viewLanc() : viewGeral();
  if (openAdd && document.getElementById('addBox')) document.getElementById('addBox').open = true;
}
const status = t => { const el = document.getElementById('lStatus'); if (el) el.textContent = t; };

/* ---------- eventos ---------- */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.classList.contains('emp-btn')) { S.emp = t.dataset.e; S.mes = null; S.imp = null; S.f = {mes:'sel',conta:'',cat:'',q:''}; savePref(); render(); }
  else if (t.classList.contains('tab')) { S.tab = t.dataset.t; savePref(); render(); }
  else if (t.classList.contains('mbtn')) { S.mes = t.dataset.m; render(); }
  else if (t.classList.contains('delAsk')) { S.confirmDel = t.dataset.id; render(); }
  else if (t.classList.contains('delGo')) { const id = t.dataset.id; S.confirmDel = null;
    try { await db.doc('lancamentos/' + id).delete(); S.lanc = S.lanc.filter(l=>l.id!==id); render(); status('Lançamento excluído.'); } catch(e){ status('Não foi possível excluir: ' + (e.message||e.code)); } }
  else if (t.id === 'xlsBtn') { baixarPlanilha(t); }
  else if (t.id === 'impCancel') { S.imp = null; render(); }
  else if (t.id === 'impGo') { const novos = S.imp.novos; t.disabled = true; let n = 0;
    try { for (const l of novos) { await db.collection('lancamentos').add(l); n++; } S.imp = null; render(); status(n + ' lançamento(s) importado(s).'); }
    catch(e){ status('Importação parou em ' + n + ' de ' + novos.length + ': ' + (e.message||e.code)); } }
  else if (t.id === 'rbtClear') { try { const ref = db.doc('empresas/'+S.emp), cur = (await ref.get()).data() || {}; const rb = {...(cur.rbt12||{})}; delete rb[S.mes]; await ref.set({...cur, rbt12: rb}); } catch(e){} }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.classList.contains('catSel')) { const id = t.dataset.id, cat = t.value;
    const l = S.lanc.find(x=>x.id===id); if (l) l.cat = cat; t.classList.toggle('pend', cat==='1.1.99');
    try { await db.doc('lancamentos/' + id).update({cat}); status('Reclassificado para ' + cat + ' ' + NOME[cat] + '.'); } catch(e){ status('Não salvou: ' + (e.message||e.code)); } }
  else if (t.id === 'flMes') { S.f.mes = t.value; render(); }
  else if (t.id === 'flConta') { S.f.conta = t.value; render(); }
  else if (t.id === 'flCat') { S.f.cat = t.value; render(); }
  else if (t.id === 'impFile' && t.files[0]) { const conta = $('#impConta').value; const fr = new FileReader();
    fr.onload = () => { try { S.imp = prepararImport(String(fr.result), conta); render(); } catch(e){ S.imp = null; render(); status(e.message); } };
    fr.readAsText(t.files[0], 'utf-8'); }
});
let qT; document.addEventListener('input', ev => { if (ev.target.id === 'flQ') { clearTimeout(qT); const v = ev.target.value; qT = setTimeout(() => { S.f.q = v; render(); const el = $('#flQ'); el.focus(); el.setSelectionRange(v.length, v.length); }, 250); } });
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  if (ev.target.id === 'addForm') {
    const v = Math.abs(parseValor($('#fValor').value)); if (!v) { status('Informe um valor maior que zero.'); return; }
    const l = {empresa:S.emp, data:$('#fData').value, conta:$('#fConta').value, descricao:$('#fDesc').value.trim(), valor: r2($('#fTipo').value==='s' ? -v : v), cat:$('#fCat').value, obs:$('#fObs').value.trim(), origem:'manual'};
    try { await db.collection('lancamentos').add(l); S.mes = l.data.slice(0,7); status('Lançado em ' + mLabel(S.mes) + '.'); ev.target.reset(); } catch(e){ status('Não foi possível lançar: ' + (e.message||e.code)); }
  }
  if (ev.target.id === 'rbtForm') {
    const v = parseValor($('#rbtIn').value); if (!(v > 0)) return;
    try { const ref = db.doc('empresas/' + S.emp); const cur = (await ref.get()).data() || {}; await ref.set({...cur, rbt12: {...(cur.rbt12||{}), [S.mes]: r2(v)}}); } catch(e){}
  }
});

/* ---------- dados ---------- */
const b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrirCifra(senha){
  const C = window.__CIFRA__, enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64u8(C.s), iterations:C.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64u8(C.i)}, key, b64u8(C.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function pedirSenha(){
  return new Promise(resolve => {
    $('#app').classList.add('rel');
    $('#ficha').innerHTML = '';
    $('#view').innerHTML = `<section class="panel" style="max-width:420px;margin:40px auto">
      <h2>Acesso restrito</h2>
      <p class="note">Relatórios contábeis da Ótica Vem Pra Cá e da RF Consultoria. Digite a senha que você recebeu da contadora.</p>
      <form class="form" id="senhaForm" style="grid-template-columns:1fr auto">
        <label>Senha<input type="password" id="senhaIn" autocomplete="current-password" required></label>
        <div><button class="btn" type="submit">Entrar</button></div>
      </form><div class="status" id="senhaMsg"></div></section>`;
    const tentar = async senha => {
      try { const snap = await abrirCifra(senha); try { sessionStorage.setItem('livro-senha', senha); } catch(e){}
        $('#app').classList.remove('rel'); resolve(snap); return true; }
      catch(e){ return false; }
    };
    let salva = null; try { salva = sessionStorage.getItem('livro-senha'); } catch(e){}
    if (salva) tentar(salva);
    $('#senhaForm').addEventListener('submit', async ev => {
      ev.preventDefault(); ev.stopPropagation();
      $('#senhaMsg').textContent = 'Abrindo…';
      if (!(await tentar($('#senhaIn').value))) $('#senhaMsg').textContent = 'Senha incorreta. Confira e tente de novo.';
    }, true);
  });
}
(async () => {
  if (window.__CIFRA__ && !window.__SNAPSHOT__) window.__SNAPSHOT__ = await pedirSenha();
  const SNAP = window.__SNAPSHOT__;
  if (SNAP) {
    S.empresas = SNAP.empresas; S.lanc = SNAP.lanc; S.readonly = true; S.snap = SNAP.geradoEm;
    render();
    const rel = location.hash.match(/^#relatorio-(otica|rf)-(\d{4}-\d{2})$/);
    if (rel) {
      S.emp = rel[1]; S.mes = rel[2]; S.readonly = true;
      renderChrome();
      $('#app').classList.add('rel');
      document.querySelector('.brand .sub').textContent = 'Relatório mensal · ' + mLong(S.mes) + ' · retrato de ' + (S.snap || '');
      $('#view').innerHTML = `<section class="rel-sec">${viewGeral()}</section>
        <section class="rel-sec rel-quebra">${viewDRE()}</section>
        <section class="rel-sec rel-quebra">${viewBal()}
        <p class="rel-rodape">Elaborado a partir dos extratos bancários (regime de caixa). O DAS é estimado pela alíquota efetiva do mês; o valor oficial é o do PGDAS-D. Lançamentos a classificar ainda podem alterar o resultado.</p></section>`;
      return;
    }
    if (location.hash === '#exportar') {
      const out = [];
      for (const emp of Object.keys(S.empresas)) { S.emp = emp; for (const m of monthsOf()) { S.mes = m;
        const u8 = new Uint8Array(montarPlanilha()); let bin = ''; for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
        out.push(emp + '|' + m + '|' + btoa(bin)); } }
      const pre = document.createElement('pre'); pre.id = 'xlsout'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
    }
    if (window.claude?.use) window.claude.use('downloads').then(d => { dl = d; renderChrome(); }).catch(() => {});
    else { dl = {save: async ({filename, data}) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return {status:'saved'}; }}; renderChrome(); }
    return;
  }
  db = await (window.claude?.use ? window.claude.use('db') : null);
  if (!db) { $('#view').innerHTML = '<div class="center">Os lançamentos ficam guardados no banco deste painel. Abra-o pelo claude.ai para carregá-los.</div>'; return; }
  window.claude.use('downloads').then(d => { dl = d; renderChrome(); }).catch(() => {});
  let got = 0;
  db.collection('empresas').onSnapshot(s => { S.empresas = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); got |= 1; if (got===3) render(); }, e => status(e.message));
  db.collection('lancamentos').onSnapshot(s => { S.lanc = s.docs.map(d => ({id:d.id, ...d.data()})); got |= 2; if (got===3) render(); }, e => status(e.message));
  try { const u = await window.claude.use('user'); if (u && u.can && (await u.can('data.write')) === false) { S.readonly = true; if (got===3) render(); } } catch(e){}
})();
renderChrome();
})();
</script>
